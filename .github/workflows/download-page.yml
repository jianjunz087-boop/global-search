name: Publish download page
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/download-page.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public download page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl -fsSL "$PAGE_URL?build=$GITHUB_SHA" -o /tmp/download-page.html && rg -q 'v1.0.0-demo.7' /tmp/download-page.html && rg -q 'id="download"' /tmp/download-page.html; then
              exit 0
            fi
            sleep 5
          done
          exit 1
