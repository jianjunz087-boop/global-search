<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>SerpAPI 设置</title><style>body{font:14px system-ui;padding:24px;color:#234d3e;background:#f7f9f6}input{width:95%;padding:10px;margin:14px 0;border:1px solid #ccd8ce;border-radius:5px}button{background:#25735d;color:white;padding:11px 17px;border:0;border-radius:5px}p{font-size:12px;line-height:1.7;color:#73836d}</style></head><body><b>SerpAPI API Key / 搜索密钥</b><p>密钥加密保存在此 Windows 用户账户中。保存后应用重启。<br>仅用于向 SerpAPI 发起搜索请求，不包含在安装包中。</p><input id="key" type="password" placeholder="SerpAPI key" autocomplete="off" aria-label="SerpAPI key"><button id="save">保存并重启 / Save & restart</button><p id="error" role="status"></p><script src="settings.js"></script></body></html>
