name: Windows installer and release
on:
  push:
    tags: ['v1.0.0-demo']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: node desktop/prepare.mjs
      - name: Verify desktop launch and local CRM persistence on Windows
        run: node tests/desktop-smoke.cjs
      - name: Build Windows x64 installer
        run: npx electron-builder --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create checksums
        shell: pwsh
        run: |
          $installer = 'dist/windows/BAIHUA-AI-TRADE-Setup-1.0.0-win-x64.exe'
          if (!(Test-Path $installer)) { throw 'Installer missing' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  BAIHUA-AI-TRADE-Setup-1.0.0-win-x64.exe" | Set-Content -Encoding utf8 dist/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BAIHUA-Windows-x64
          path: |
            dist/windows/BAIHUA-AI-TRADE-Setup-1.0.0-win-x64.exe
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Windows demo release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.0-demo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0-demo --target "$env:GITHUB_SHA" --title 'BAIHUA AI TRADE 1.0.0 — Windows 测试版' --prerelease --notes-file desktop/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v1.0.0-demo dist/windows/BAIHUA-AI-TRADE-Setup-1.0.0-win-x64.exe dist/windows/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
