name: Windows installer and release
on:
  push:
    tags: ['v*-demo*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "APP_VERSION=$version" | Add-Content $env:GITHUB_ENV
          "INSTALLER_NAME=BAIHUA-AI-TRADE-Setup-$version-win-x64.exe" | Add-Content $env:GITHUB_ENV
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: node desktop/prepare.mjs
      - name: Verify desktop launch and local CRM persistence on Windows
        run: node tests/desktop-smoke.cjs
      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          $buildExit = 0
          try {
            & ./desktop/build-windows.ps1 *> windows-build.log
            $buildExit = $LASTEXITCODE
          } catch {
            $buildExit = 1
            $_.ToString() | Add-Content windows-build.log
          }
          Get-Content windows-build.log | Write-Output
          if ($buildExit -ne 0) {
            $details = (Get-Content windows-build.log -Tail 100 | ForEach-Object { $_.Trim() } | Where-Object { $_ -and $_.Length -lt 1800 -and $_ -notmatch '^Command line defined|^•' } | Select-Object -Last 20) -join "`n"
            $details = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            if ($details.Length -gt 3800) { $details = $details.Substring($details.Length - 3800) }
            Write-Output "::error::$details"
            exit $buildExit
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create checksums
        shell: pwsh
        run: |
          $installer = "dist/windows/$env:INSTALLER_NAME"
          if (!(Test-Path $installer)) { throw 'Installer missing' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:INSTALLER_NAME" | Set-Content -Encoding utf8 dist/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BAIHUA-Windows-x64
          path: |
            dist/windows/${{ env.INSTALLER_NAME }}
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Windows demo release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-demo.manual.{1}', env.APP_VERSION, github.run_number) }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "$env:GITHUB_SHA" --title "BAIHUA AI TRADE $env:APP_VERSION — Windows 测试版" --prerelease --notes-file desktop/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload "$env:RELEASE_TAG" "dist/windows/$env:INSTALLER_NAME" dist/windows/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
